// CSM modules: one source set, one dev jar and one reobfuscated jar per optional module.
//
// Core is the `main` source set at src/main (the GTCEu build.gradle hard-codes that path in
// its modGroup check and in generateAssets, so Core cannot move). Every other module lives in
// modules/<name>/src/main/{java,resources}, compiles against Minecraft + Core only, and ships
// as minecraft-city-super-mod-<name>-<version>.jar next to the Core jar.
//
// Why this works with the "DO NOT CHANGE" build.gradle and RetroFuturaGradle 1.4.7:
//  - RFG adds a task rule `reobf<JarTaskName>` (mcp/MCPTasks.java) that reobfuscates the output
//    of ANY Jar task with the same SRG/CSV/exceptor inputs as the default reobfJar, so a module's
//    release jar needs no manual reobfuscation wiring.
//  - RFG's runClient/runServer put the `jar` task's archive on the game classpath rather than
//    the source set output, and RunMinecraftTask exposes classpath(...), so extra dev jars are
//    added the same way. FML then discovers each jar's @Mod as a classpath mod.
//  - Jabel is configured for every JavaCompile task except the two Minecraft ones, so module
//    source sets get the same modern-syntax-targeting-Java-8 compiler.
// This file is applied from addon.gradle, i.e. after build.gradle has finished configuring
// `main`, so copying main's classpaths here picks up everything RFG added to them.

def csmModules = [
    [name: 'powergrid', modId: 'csm_powergrid', displayName: 'CSM: Power Grid'],
    [name: 'roads', modId: 'csm_roads', displayName: 'CSM: Roads & Traffic'],
    [name: 'lifesafety', modId: 'csm_lifesafety', displayName: 'CSM: Life Safety'],
    [name: 'hvac', modId: 'csm_hvac', displayName: 'CSM: HVAC'],
    [name: 'lighting', modId: 'csm_lighting', displayName: 'CSM: Lighting'],
    [name: 'building', modId: 'csm_building', displayName: 'CSM: Building Materials'],
    [name: 'furnishings', modId: 'csm_furnishings', displayName: 'CSM: Furniture & Novelties'],
    [name: 'technology', modId: 'csm_technology', displayName: 'CSM: Technology'],
    [name: 'tts', modId: 'csm_tts', displayName: 'CSM: Text to Speech', deps: ['technology'], shadow: true],
]

// Core's archive base name is minecraft-city-super-mod-core (buildscript.properties), so module
// jars cannot be named from it directly — they would come out as
// minecraft-city-super-mod-core-roads-<version>.jar. Strip the trailing "-core" instead, so the
// prefix shared by every jar still has exactly one source of truth.
def csmArchivePrefix = base.archivesName.get().replaceAll('-core$', '')

// The GTCEu build.gradle pulls the shadow plugin in through its `plugins { ... apply false }`
// block, and a plugins-block class is visible to build.gradle itself but not to a script applied
// with `apply from:` — an `import` of ShadowJar at the top of this file fails to compile. Ask the
// project's own script classloader for the type instead. Nothing applies the shadow plugin: Core
// shades nothing, and a hand-registered ShadowJar task needs only the class.
def shadowJarType = project.buildscript.classLoader.loadClass(
        'com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar')

// The tasks that launch a game in the dev environment. Not all exist in every configuration
// (the Java 17/21 ones are optional), hence tasks.matching rather than tasks.named.
def csmRunTaskNames = ['runClient', 'runServer', 'runClient17', 'runServer17', 'runClient21', 'runServer21']

// Which module jars the run tasks load. Default: all of them. `-PcsmRunModules=core` runs Core
// alone; `-PcsmRunModules=powergrid,hvac` runs Core plus those modules. Core is always loaded.
// This is how the "each module alone" and "Core only" checks are run without deleting jars.
def csmRunModulesProperty = (project.findProperty('csmRunModules') ?: 'all').toString().trim()
if (csmRunModulesProperty.isEmpty()) {
    throw new GradleException("csmRunModules is empty; use all, core, or a comma-separated list of module names")
}
def csmRunModulesRequested = csmRunModulesProperty.split(',').collect { it.trim() }.findAll { it }
def csmRunModules = csmRunModulesRequested.contains('all')
        ? csmModules.collect { it.name }
        : csmRunModulesRequested.findAll { it != 'core' }
csmRunModules.each { name ->
    if (!csmModules.any { it.name == name }) {
        throw new GradleException("csmRunModules names unknown module '${name}'; known: " + csmModules.collect { it.name })
    }
}

csmModules.each { m ->
    def cap = m.name.capitalize()
    def moduleDir = "modules/${m.name}"

    def ss = sourceSets.create(m.name) {
        java.srcDirs = ["${moduleDir}/src/main/java"]
        resources.srcDirs = ["${moduleDir}/src/main/resources"]
    }
    // Minecraft + Core, nothing else: the compiler is the module boundary. A module that
    // declares `deps: ['other']` also sees that module's classes (Text to Speech compiles
    // against Technology because its Redstone TTS block links to Technology's speakers); list
    // dependencies before dependants in csmModules so the source set already exists.
    ss.compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    ss.runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    (m.deps ?: []).each { depName ->
        def dep = sourceSets.getByName(depName)
        ss.compileClasspath += dep.output
        ss.runtimeClasspath += dep.output
    }
    // A module marked `shadow: true` bundles third-party libraries into its own jar and gets
    // them from a configuration named after it (tts -> ttsShadow, declared in
    // dependencies.gradle). Core shades nothing, so this is the only route those classes have
    // onto the module's compile classpath.
    def shadowConfig = m.shadow ? configurations.getByName("${m.name}Shadow") : null
    if (shadowConfig != null) {
        ss.compileClasspath += shadowConfig
        ss.runtimeClasspath += shadowConfig
    }
    // Jabel and the other annotation processors are declared on Core's configuration only;
    // without this the module compile finds the Jabel plugin on its classpath but not the
    // processor path and dies with a ClassNotFoundException deep inside ByteBuddy.
    configurations.named(ss.annotationProcessorConfigurationName).configure {
        extendsFrom(configurations.annotationProcessor)
    }

    // A module's unit tests run in the one JUnit suite alongside Core's.
    sourceSets.test.java.srcDir "${moduleDir}/src/test/java"
    sourceSets.test.compileClasspath += ss.output
    sourceSets.test.runtimeClasspath += ss.output

    // Same token expansion the buildscript applies to Core's mcmod.info, plus Core's pack.mcmeta.
    //
    // The pack.mcmeta is not cosmetic. A mod jar without one gets a dummy pack_format 2 from
    // FMLFileResourcePack, and FMLClientHandler.addModAsResource then wraps the pack in vanilla's
    // LegacyV2Adapter, which rewrites every lang/<code>.lang lookup to the pre-1.11 upper-case
    // form (lang/en_US.lang). Models and textures pass through untouched, so the module looks
    // healthy in game while every one of its display names renders as tile.<id>.name. Copying
    // Core's format-3 file into every module jar means no module can forget it.
    tasks.named(ss.processResourcesTaskName, ProcessResources).configure {
        from(file('src/main/resources/pack.mcmeta'))
        // The dedicated server loads translations per mod container from
        // assets/<that mod's id>/lang/en_us.lang only (FMLServerHandler.addModAsResource), so a
        // module's csm-domain lang file is invisible server-side and FML warns "Missing English
        // translation for <modid>". Duplicating the module's lang files under its own mod id at
        // build time gives the server its names with no runtime code; the client loads both
        // copies and they carry identical keys.
        from("${moduleDir}/src/main/resources/assets/csm/lang") {
            into "assets/${m.modId}/lang"
        }
        inputs.property 'version', modVersion
        inputs.property 'mcversion', minecraftVersion
        inputs.property 'modid', m.modId
        filesMatching('mcmod.info') { fcd ->
            fcd.expand(
                    'version': modVersion,
                    'mcversion': minecraftVersion,
                    'modid': m.modId,
                    'modname': m.displayName
            )
        }
    }

    // The MCP-named dev jar, loaded by the dev client. Classifier matches RFG's own `jar`.
    // A shadow module's jar is a ShadowJar so it can carry its bundled libraries; it is still a
    // Jar, which is what RFG's reobf<JarTaskName> rule needs to reobfuscate it below.
    def jarTask = tasks.register("${m.name}Jar", m.shadow ? shadowJarType : Jar) {
        group = 'build'
        description = "Assembles the ${m.displayName} dev jar"
        from ss.output
        archiveBaseName.set("${csmArchivePrefix}-${m.name}".toString())
        archiveClassifier.set('dev')
        manifest {
            attributes(
                    'Implementation-Title': m.displayName,
                    'Implementation-Version': modVersion,
                    'Implementation-Vendor': 'Mica Technologies'
            )
        }
    }

    // The release jar, produced by RFG's reobf<JarTaskName> rule from the dev jar above.
    //
    // The remapper renames a Minecraft field or method reference by walking the class hierarchy
    // of the class that owns the reference. A module block that touches `this.blockState` owns
    // that reference on itself, and the chain to net.minecraft.block.Block runs through Core's
    // AbstractBlock -- which the rule's default reference classpath (Minecraft + dependencies)
    // does not contain. Without Core here the field keeps its MCP name and the shipped jar dies
    // in a real game with NoSuchFieldError: blockState, while the dev client, which runs MCP
    // names throughout, never notices. Core's classes and any module this one compiles
    // against are therefore added to the reference classpath.
    def reobfTask = tasks.named("reobf${cap}Jar")
    reobfTask.configure {
        referenceClasspath.from(sourceSets.main.output.classesDirs)
        (m.deps ?: []).each { depName -> referenceClasspath.from(sourceSets.getByName(depName).output.classesDirs) }
        dependsOn(sourceSets.main.classesTaskName)
        (m.deps ?: []).each { depName -> dependsOn(sourceSets.getByName(depName).classesTaskName) }
    }
    tasks.named('assemble').configure { dependsOn(reobfTask) }

    if (csmRunModules.contains(m.name)) {
        csmRunTaskNames.each { runName ->
            tasks.matching { it.name == runName }.configureEach {
                dependsOn(jarTask)
                classpath(jarTask)
            }
        }
    }
}

// MaryTTS is shaded into the Text to Speech module jar, not Core's. The configuration below
// moved here from addon.gradle, where it set up Core's shadowJar back when Core shaded
// MaryTTS itself. The relocation prefix is unchanged, so every relocated class keeps the
// name it has always had at runtime.
//
// MaryTTS uses Java ServiceLoader for module/voice discovery. The shadow plugin must
// merge META-INF/services files from all JARs so every module is found at runtime.
tasks.named('ttsJar', shadowJarType).configure {
    configurations = [project.configurations.ttsShadow]

    // The shadow plugin's own shadowJar task carries these excludes; a ShadowJar registered
    // by hand does not, and a stale INDEX.LIST or a signature file left over from a bundled
    // jar breaks class loading out of it.
    exclude 'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'

    mergeServiceFiles()
    // Minecraft bundles a stripped ICU4J fork (icu4j-core-mojang:51.2) on the system
    // classloader. Forge's parent-first delegation means that copy always wins, but it's
    // missing locale data MaryTTS needs (causing StackOverflowError). Relocating our
    // full ICU4J gives MaryTTS its own complete copy without conflicting.
    relocate 'com.ibm.icu', 'com.micatechnologies.minecraft.csm.shadow.com.ibm.icu'

    // MaryTTS also pulls in commons-lang 2.x and commons-collections, and shading those under
    // their own names does not work: FML's relauncher registers `org.apache.commons.` as a
    // CLASSLOADER EXCLUSION, so LaunchClassLoader.findClass delegates every class under that
    // package straight to its parent and never looks inside a mod jar. All 143 commons-lang
    // classes were in the jar and unreachable by construction.
    //
    // The symptom: MaryTTS never starts, and every TTS call silently falls through to the
    // system narrator instead.
    //
    //   [CSM-TTS] Failed to initialize MaryTTS — TTS will fall back to system narrator
    //   java.lang.NoClassDefFoundError: org/apache/commons/lang/StringUtils
    //       at marytts.config.MaryConfig.getList(MaryConfig.java:261)
    //
    // Same class of problem as the ICU relocation above, and the same fix: give MaryTTS its own
    // copy under a package name Forge has no opinion about.
    //
    // The lang3 exclude is load-bearing. Shadow matches relocation patterns by path prefix, so
    // `org.apache.commons.lang` also matches `org.apache.commons.lang3` — which is deliberately
    // NOT shaded (see excludeForgeProvided in dependencies.gradle) because Forge provides it.
    // Without the exclude, every lang3 reference would be rewritten to point at a shaded
    // package that does not exist.
    relocate('org.apache.commons.lang',
            'com.micatechnologies.minecraft.csm.shadow.org.apache.commons.lang') {
        exclude 'org.apache.commons.lang3.**'
    }
    relocate 'org.apache.commons.collections',
            'com.micatechnologies.minecraft.csm.shadow.org.apache.commons.collections'

    // MaryTTS logs through the old org.apache.log4j API, so we shade the log4j 1.x -> 2.x
    // bridge (see dependencies.gradle). Shading it under its own name does not work either,
    // for a third reason on top of the two above -- not a parent-first collision like ICU, and
    // not a classloader exclusion like commons-lang, but a POISONED CACHE.
    //
    // Netty probes for a logging backend during Forge's startup, and its search order reaches
    // log4j 1.x before log4j 2:
    //
    //   at io.netty.util.internal.logging.Log4JLoggerFactory.newInstance(Log4JLoggerFactory.java:38)
    //   at io.netty.util.internal.logging.InternalLoggerFactory.newDefaultFactory(InternalLoggerFactory.java:47)
    //
    // That runs long before this mod's jar can serve those classes, so the load fails and
    // LaunchClassLoader records the name in `invalidClasses` -- permanently. Every later
    // request short-circuits on the first line of findClass and throws ClassNotFoundException
    // without looking in any jar. MaryTTS then dies during startup and every TTS call falls
    // through to the system narrator:
    //
    //   [CSM-TTS] Failed to initialize MaryTTS - TTS will fall back to system narrator
    //   java.lang.NoClassDefFoundError: org/apache/log4j/Priority
    //       at org.apache.log4j.LogManager.getRootLogger(LogManager.java:89)
    //
    // The class was in the jar and undamaged the whole time; the name was blacklisted before we
    // ever got a turn. Relocating gives MaryTTS a name Netty never probed and so never
    // poisoned. This carries slf4j-log4j12's binding with it, which is shaded alongside and
    // references the same package.
    //
    // `org.apache.logging.log4j` -- Forge's log4j 2, deliberately not shaded -- does not match
    // this pattern, since it is not under the org.apache.log4j path. The bridge therefore keeps
    // delegating to the real logging backend.
    relocate 'org.apache.log4j',
            'com.micatechnologies.minecraft.csm.shadow.org.apache.log4j'

    // Same poisoning, one probe earlier. Netty tries SLF4J before it tries log4j 1.x, so
    // `org.slf4j` is blacklisted a few milliseconds before `org.apache.log4j` is, by the
    // adjacent frame in the very same InternalLoggerFactory.newDefaultFactory call:
    //
    //   at io.netty.util.internal.logging.Slf4JLoggerFactory.<init>(Slf4JLoggerFactory.java:40)
    //   at io.netty.util.internal.logging.InternalLoggerFactory.newDefaultFactory(InternalLoggerFactory.java:42)
    //
    // Relocating log4j alone therefore only moves the failure: MaryTTS gets all the way through
    // module registration and then dies starting JTokeniser, whose static initialiser wants
    // org.slf4j.LoggerFactory. Both packages have to move, for the identical reason.
    //
    // This takes the bundled slf4j-api and the slf4j-log4j12 binding together, which is what we
    // want -- SLF4J finds its binding by looking up org/slf4j/impl/StaticLoggerBinder, and both
    // sides of that lookup are relocated in step.
    relocate 'org.slf4j',
            'com.micatechnologies.minecraft.csm.shadow.org.slf4j'
}

// Lists every release jar file name, one per line, for the release workflow: Core first, then
// one line per module. The workflow copies and hashes exactly what this prints, so a module
// added above ships without touching the workflow.
task printModuleJarNames {
    doLast {
        println "${base.archivesName.get()}-${project.version}.jar"
        csmModules.each { m -> println "${csmArchivePrefix}-${m.name}-${project.version}.jar" }
    }
}
