site_name: City Super Mod
site_description: >-
  The City Super Mod for Minecraft 1.12.2 — 1,600+ city blocks: working traffic signals, fire
  alarm systems, street lighting, road signs, HVAC and more.
site_url: https://mica-technologies.github.io/minecraft-city-super-mod/
repo_url: https://github.com/Mica-Technologies/minecraft-city-super-mod
repo_name: Mica-Technologies/minecraft-city-super-mod
edit_uri: edit/main/docs/
copyright: >-
  The City Super Mod is open source. Documentation is part of the mod's repository.

# Working plans are gitignored and absent from a CI checkout anyway. This stops a LOCAL
# `mkdocs serve` from finding them and quietly publishing one on the next deploy.
exclude_docs: |
  agent_progress/

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/traffic-light
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.tooltips
    - toc.follow
  palette:
    # Mica Minecraft's grass green over the launcher's gray surfaces, so this site, the Minecraft
    # homepage and the launcher present as one identity. The exact ramps live in assets/csm.css;
    # `custom` here only tells Material to read them from there rather than ship its own.
    #
    # Both modes are first-class per the design guidelines, so neither is a recolour of the other.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Turns Material's :material-xxx: / :octicons-xxx: shortcodes into inline SVG. Without it they
  # are left as literal text, which is what the landing page cards were showing instead of icons.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

extra_css:
  - assets/csm.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Mica-Technologies/minecraft-city-super-mod
      name: The mod on GitHub

nav:
