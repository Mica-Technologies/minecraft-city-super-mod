name: Test Mod Build (Pull Request)

# Also dispatchable by hand: a pull request that renames thousands of files (the module split
# did) can leave GitHub without any check run at all, and this is the only way to get the
# compile and the two server-smoke legs for such a branch.
on:
  pull_request:
  workflow_dispatch:

# Superseded runs on the same PR are pointless — the server smoke test is slow.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # RFG runs the Gradle process on Java 21+ (compiler + mod code stay Java 8 via
      # Jabel); older Gradle-JVM Java versions are deprecated and slated for removal.
      - name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble mod with Gradle
        run: ./gradlew build -Dhttp.socketTimeout=60000 -Dhttp.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.http.connectionTimeout=60000

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: build/reports/tests/test/
          retention-days: 7

  # The asset/registration check: every discovered block and item has its blockstate, models,
  # textures and lang name, no model parent chain loops, and so on. It exits 1 on an error and a
  # clean tree has none, so a new one fails the pull request. Unused files and unused lang entries
  # are printed but never fail it: whether to delete a leftover is a human call. See
  # dev-env-utils/docs/BlockItemIntegrityTool.md.
  integrity:
    name: Block/Item Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: dev-env-utils/pom.xml

      # clean compile first, always: exec:java alone runs whatever was compiled last.
      - name: Run the integrity tool
        working-directory: dev-env-utils
        run: >-
          mvn -B -q clean compile exec:java
          -Dexec.mainClass=com.micatechnologies.minecraft.csm.tools.BlockItemIntegrityTool
          -Dexec.args="${{ github.workspace }}"

  server_smoke_test:
    # The all-modules leg keeps the exact name the branch protection rule requires; only the
    # Core-only leg carries a suffix.
    name: ${{ matrix.modules == 'all' && 'Dedicated Server Smoke Test' || format('Dedicated Server Smoke Test ({0})', matrix.modules) }}
    needs: compile
    runs-on: ubuntu-latest
    # CSM is a large content mod; world gen on a cold cache is the slow part.
    timeout-minutes: 30
    strategy:
      # A Core-only failure and an all-modules failure are different bugs; run both legs.
      fail-fast: false
      matrix:
        # `all` is what players who install everything get. `core` boots the mandatory jar on
        # its own, which is the cheapest guard against Core reaching into a module: the compiler
        # cannot see that across source sets at runtime, and a player who installs Core alone
        # would be the one to find out.
        modules: [all, core]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # RFG runs the Gradle process on Java 21+ (compiler + mod code stay Java 8 via
      # Jabel); older Gradle-JVM Java versions are deprecated and slated for removal.
      - name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # `./gradlew build` passing proves nothing about whether the mod can LOAD on a
      # dedicated server: client-only classes reached from common code, a client mod
      # declared as a hard dependency, or a Side.CLIENT packet handler touching
      # Minecraft directly all compile cleanly and only fail at server startup.
      # The sibling SUM mod shipped three such bugs simultaneously in 2026.07.19 and
      # took the Alto server down; all three were caught by a single `runServer`.
      - name: Boot dedicated server and assert startup
        run: bash .github/scripts/server-smoke-test.sh
        env:
          SMOKE_TIMEOUT: '1200'
          GRADLE_ARGS: -PcsmRunModules=${{ matrix.modules }}

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-smoke-log-${{ matrix.modules }}
          path: server-smoke.log
          retention-days: 7
