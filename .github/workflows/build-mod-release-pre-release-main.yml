name: Build Mod Release/Pre-Release (Main Branch)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a full release'
        required: false
        default: 'false'

jobs:
  assemble_release:
    name: Build Mod and Publish Release/Pre-Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # RFG runs the Gradle process on Java 21+ (compiler + mod code stay Java 8 via
      # Jabel); older Gradle-JVM Java versions are deprecated and slated for removal.
      - name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6


      - name: Create Version Numbers
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$calculatedSha" >> $GITHUB_ENV

          # Calculate 'final' version number (YYYY.MM.DD).
          # If a release tag already exists for today, append SemVer 2.0
          # build metadata (+N) so subsequent same-day releases stay unique
          # without inventing a non-SemVer 4th segment.
          baseVersion=$(date -u +'%Y.%m.%d')
          git fetch --tags --quiet origin || true
          relVersion="$baseVersion"
          maxN=-1
          if git rev-parse -q --verify "refs/tags/$baseVersion" >/dev/null 2>&1; then
            maxN=0
          fi
          for existingTag in $(git tag -l "${baseVersion}+*"); do
            suffix="${existingTag#${baseVersion}+}"
            if [[ "$suffix" =~ ^[0-9]+$ ]] && [ "$suffix" -gt "$maxN" ]; then
              maxN="$suffix"
            fi
          done
          if [ "$maxN" -ge 0 ]; then
            relVersion="${baseVersion}+$((maxN + 1))"
          fi
          echo "REL_TAG=$relVersion" >> $GITHUB_ENV

          # Calculate 'pre-release' version number (YYYY.MM.DD-pre.hhmm.shorttz+COMMITSHORTSHA)
          preReleaseVersion=$(date -u +'%Y.%m.%d-pre.%H%M.%Z%z')"+$calculatedSha"
          echo "PRE_TAG=$preReleaseVersion" >> $GITHUB_ENV

      - name: Create Release Tag
        if: ${{ github.event.inputs.release == 'true' && github.event.inputs.release }}
        run: |
          git tag "${{ env.REL_TAG }}" "${{ github.sha }}"
          git push origin "${{ env.REL_TAG }}"

      - name: Create Pre-Release Tag
        if: ${{ github.event.inputs.release == 'false' || !github.event.inputs.release }}
        run: |
          git tag "${{ env.PRE_TAG }}" "${{ github.sha }}"
          git push origin "${{ env.PRE_TAG }}"

      # The version the jars are stamped with comes from `git describe --abbrev=0 --tags`
      # (build.gradle's getLastTag), which asks "some tag on this commit" and not "the tag being
      # published". A dispatched release and a pushed pre-release of the same commit leave BOTH
      # tags on it — 2026.09.17 and 2026.09.17-pre.2131.UTC+0000+09d91b3de both point at
      # 09d91b3de today — and which one describe answers with is not ours to decide. If it
      # answers with the pre-release tag, a full release ships jars stamped as a pre-release,
      # and `mcmod.info` inside them says so too. The same bug bit MCMCP on 2026-09-09.
      #
      # So the version is STATED rather than inferred: buildscript.properties' modVersion is
      # empty, and build.gradle only falls back to git when it is (build.gradle:329). This edit
      # is CI-only and never committed.
      - name: Pin the mod version to the tag being published
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.release }}" = "true" ]; then
            chosen="${{ env.REL_TAG }}"
          else
            chosen="${{ env.PRE_TAG }}"
          fi
          echo "CHOSEN_TAG=$chosen" >> "$GITHUB_ENV"

          sed -i "s|^modVersion =.*|modVersion = $chosen|" buildscript.properties
          grep -n '^modVersion' buildscript.properties

          # getLastTag also feeds the generated changelog, which asks git the same ambiguous
          # question, so the other tags on this commit go too. Local refs only: the remote tags,
          # and so the release history, are untouched. `|| true` because grep exits 1 when the
          # chosen tag is the only one on the commit, which is the ordinary pre-release case.
          others="$(git tag --points-at "${{ github.sha }}" | grep -vxF "$chosen" || true)"
          if [ -n "$others" ]; then
            echo "$others" | xargs git tag -d
          fi
          echo "Local tags now on this commit:"
          git tag --points-at "${{ github.sha }}"

      - name: Assemble Mod with Gradle
        run: ./gradlew build -Dhttp.socketTimeout=60000 -Dhttp.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.http.connectionTimeout=60000

      # `| tail -n 1`: these values are pasted into a filename by the publish step below, so
      # any stray stdout line corrupts the release. Gradle prints banners during project
      # evaluation even under -q — the buildscript update check did exactly that on
      # 2026-07-27 and the release died on `cp ./build/libs/Build script update available!...`.
      # Taking the last line keeps the print task's own output. gradle.properties disables
      # that particular check at the source; this is the belt-and-braces half.
      - name: Save Mod Name to GITHUB_ENV
        run: |
          modName=$(${{github.workspace}}/gradlew -q printModName | tail -n 1 | xargs)
          echo "MOD_NAME=$modName" >> $GITHUB_ENV

      - name: Save Mod Version to GITHUB_ENV
        run: |
          modVersion=$(${{github.workspace}}/gradlew -q printModVersion | tail -n 1 | xargs)
          echo "MOD_VERSION=$modVersion" >> $GITHUB_ENV

      # Shape validation cannot catch a version that is well formed but simply not the one being
      # published, so this compares against the intended value. It runs before anything is
      # uploaded, because the version is baked into the jars and mcmod.info as well as the file
      # names — a wrong one cannot be fixed by renaming the assets afterwards.
      - name: Fail if the built version is not the tag being published
        run: |
          built="${{ env.MOD_VERSION }}"
          chosen="${{ env.CHOSEN_TAG }}"
          if [ "$built" != "$chosen" ]; then
            echo "::error::Built version '$built' does not match the published tag '$chosen'. Every jar, and the mcmod.info inside it, would be stamped '$built'. Refusing to publish."
            exit 1
          fi
          echo "Built version matches the published tag: $built"

      - name: Save Minecraft Version to GITHUB_ENV
        run: |
          minecraftVersion=$(${{github.workspace}}/gradlew -q printMinecraftVersion | tail -n 1 | xargs)
          echo "MINECRAFT_VERSION=$minecraftVersion" >> $GITHUB_ENV

      # The mod releases as a mandatory Core jar plus one optional jar per subsystem, so the
      # release assets come from a list Gradle prints rather than from a name pasted together
      # here: `printModuleJarNames` prints the Core jar first and then one module jar per line,
      # and a module added to modules.gradle ships without anyone remembering this file exists.
      #
      # The grep is the same defence as the `| tail -n 1` above, generalised to a list. Gradle
      # prints banners during project evaluation even under -q — the buildscript update check
      # corrupted a release that way on 2026-07-27, and RFG prints a JDK deprecation notice on
      # older Java — and these names go straight into `cp` and the hash commands. Keeping only
      # the lines shaped like a jar file name discards banners however many there are.
      - name: Collect Release Jars and Calculate Hashes
        run: |
          set -euo pipefail
          mapfile -t jars < <(${{github.workspace}}/gradlew -q printModuleJarNames \
            | tr -d '\r' | grep -E '^[A-Za-z0-9._+-]+\.jar$')
          if [ "${#jars[@]}" -eq 0 ]; then
            echo "::error::printModuleJarNames listed no jar names"
            exit 1
          fi

          : > SHA256SUMS.txt
          {
            printf '| Jar | SHA-1 | SHA-256 | MD5 | CRC-32 |\n'
            printf '|---|---|---|---|---|\n'
          } > release-jar-table.md

          for jar in "${jars[@]}"; do
            if [ ! -f "build/libs/$jar" ]; then
              echo "::error::build/libs/$jar was listed but never built"
              exit 1
            fi
            cp "build/libs/$jar" ./
            sha1=$(sha1sum "$jar" | awk '{print $1}')
            sha256=$(sha256sum "$jar" | awk '{print $1}')
            md5=$(md5sum "$jar" | awk '{print $1}')
            crc32=$(cksum "$jar" | awk '{print $1}')
            # sha256sum's own format, so `sha256sum -c SHA256SUMS.txt` verifies a download.
            printf '%s  %s\n' "$sha256" "$jar" >> SHA256SUMS.txt
            printf '| `%s` | `%s` | `%s` | `%s` | `%s` |\n' \
              "$jar" "$sha1" "$sha256" "$md5" "$crc32" >> release-jar-table.md
          done

          echo "==> ${#jars[@]} release jars"
          cat SHA256SUMS.txt

          {
            echo "RELEASE_FILES<<CSM_RELEASE_EOF"
            printf '%s\n' "${jars[@]}"
            echo "SHA256SUMS.txt"
            echo "CSM_RELEASE_EOF"
            echo "RELEASE_JAR_TABLE<<CSM_RELEASE_EOF"
            cat release-jar-table.md
            echo "CSM_RELEASE_EOF"
            # Every jar plus SHA256SUMS.txt. The publish step is verified against this below.
            echo "RELEASE_FILE_COUNT=$(( ${#jars[@]} + 1 ))"
          } >> "$GITHUB_ENV"

      - name: Create Release Entry
        if: ${{ github.event.inputs.release == 'true' && github.event.inputs.release }}
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.REL_TAG }}
          name: Release ${{ env.MOD_VERSION }} (${{ env.MINECRAFT_VERSION }})
          body: |
            Release of City Super Mod (all jars listed below; the core jar is required)
            Mod Version: ${{ env.MOD_VERSION }}
            Game Version: ${{ env.MINECRAFT_VERSION }}

            The `core` jar is required. Every other jar is optional and adds one subsystem;
            install as many of them alongside Core as you want. All jars in a release must be
            the same version as each other.

            ${{ env.RELEASE_JAR_TABLE }}

            `SHA256SUMS.txt` is attached in `sha256sum` format, so
            `sha256sum -c SHA256SUMS.txt` checks a download.
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.RELEASE_FILES }}

      - name: Create Pre-Release Entry
        if: ${{ github.event.inputs.release == 'false' || !github.event.inputs.release }}
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.PRE_TAG }}
          name: Pre-Release ${{ env.MOD_VERSION }} (${{ env.MINECRAFT_VERSION }})
          body: |
            Pre-Release of City Super Mod (all jars listed below; the core jar is required)
            Mod Version: ${{ env.MOD_VERSION }}
            Game Version: ${{ env.MINECRAFT_VERSION }}

            The `core` jar is required. Every other jar is optional and adds one subsystem;
            install as many of them alongside Core as you want. All jars in a release must be
            the same version as each other.

            ${{ env.RELEASE_JAR_TABLE }}

            `SHA256SUMS.txt` is attached in `sha256sum` format, so
            `sha256sum -c SHA256SUMS.txt` checks a download.

            NOTICE: This is a pre-release version of the mod and is not
            guaranteed to be stable or permanently available for download/usage.
            Pre-release versions of City Super Mod may be removed or unavailable after
            90 days from their initial release.
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ env.RELEASE_FILES }}

      # The publish step above uploads the jars in parallel and has been seen to lose some of
      # them: on 2026-09-17 it reported `Error creating asset temp dir`, attached 8 of the 10
      # jars, and left the release as a draft — while the job itself carried on and the run
      # looked like a build problem rather than a publish one. A release missing a module jar
      # is worse than no release at all, because the launcher manifests point straight at these
      # file names, so the release is read back from the API here and the job fails unless every
      # jar and SHA256SUMS.txt is attached and the entry is actually published.
      - name: Verify the release has every jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.release }}" = "true" ]; then
            tag="${{ env.REL_TAG }}"
          else
            tag="${{ env.PRE_TAG }}"
          fi

          read -r attached isDraft < <(gh release view "$tag" \
            --repo "${{ github.repository }}" \
            --json assets,isDraft \
            --jq '"\(.assets | map(select(.state == "uploaded")) | length) \(.isDraft)"')

          echo "==> $tag has $attached of ${{ env.RELEASE_FILE_COUNT }} assets (draft=$isDraft)"
          gh release view "$tag" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[] | "    \(.name) \(.state)"'

          if [ "$attached" -ne "${{ env.RELEASE_FILE_COUNT }}" ]; then
            echo "::error::$tag has $attached uploaded assets, expected ${{ env.RELEASE_FILE_COUNT }}"
            exit 1
          fi
          if [ "$isDraft" != "false" ]; then
            echo "::error::$tag is still a draft"
            exit 1
          fi