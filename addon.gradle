// ARM macOS (Apple Silicon) support for runClient17/runClient21:
// MC 1.12.2 bundles JNA 4.4.0 and java-objc-bridge 1.0.0, both x86_64-only.
// Override with arm64-compatible versions via java17PatchDependencies
// (loaded before MC's bundled libs on the classpath).
if (project.hasProperty('enableJava17RunTasks') && enableJava17RunTasks.toBoolean()) {
    dependencies {
        java17PatchDependencies('net.java.dev.jna:jna:5.13.0') { transitive = false }
        java17PatchDependencies('net.java.dev.jna:jna-platform:5.13.0') { transitive = false }
        java17PatchDependencies('ca.weblite:java-objc-bridge:1.1') { transitive = false }
    }
}

// Fix: wire the Java 17/21 run tasks to shadowJar.
// When usesShadowedDependencies = true, build.gradle disables the plain `jar` task and makes
// shadowJar produce the dev jar the run tasks load. build.gradle's own loop only adds
// `dependsOn('shadowJar')` to the base runClient/runServer tasks, NOT to the
// runClient17/runServer17/runClient21/runServer21 variants registered when
// enableJava17RunTasks = true. Under Gradle 8.9 a task consuming another task's output without
// declaring the dependency is a hard validation error, so runClient17 fails with:
//   "Task ':runClient17' uses this output of task ':shadowJar' without declaring ... a dependency."
// Declaring it here is update-safe (build.gradle is "DO NOT CHANGE").
if (project.hasProperty('enableJava17RunTasks') && enableJava17RunTasks.toBoolean()
        && project.hasProperty('usesShadowedDependencies') && usesShadowedDependencies.toBoolean()) {
    for (runTask in ['runClient17', 'runServer17', 'runClient21', 'runServer21']) {
        tasks.named(runTask).configure {
            dependsOn('shadowJar')
        }
    }
}

// Apple-Silicon fallback: run the LWJGL2 client under x86_64 (Rosetta 2).
//
// runClient17 (lwjgl3ify/arm64-native) launches but its window is broken on macOS —
// lwjgl3ify 1.0.1 (RFB 1.0.6) skips the relauncher re-exec in the gradle dev launch, so
// GLFW never gets macOS's required first-thread handling and Apple's OpenGL-over-Metal
// driver crashes on a zero-area window (SIGSEGV in AppleMetalOpenGLRenderer on first draw).
// The reliable dev client on Apple Silicon is the vanilla LWJGL2 path under Rosetta, using
// Minecraft's bundled x86_64 LWJGL2/JNA natives.
//
// Usage:  ./gradlew runClient -Prosetta
// Requires Rosetta 2 (`softwareupdate --install-rosetta --agree-to-license`) and an
// x86_64 Java 8 JDK in a Gradle-auto-detected location (e.g.
// ~/Library/Java/JavaVirtualMachines/). Java 8 + Adoptium uniquely selects the x86_64
// Temurin here (the arm64 Java 8 is Azul), so the launcher resolves with no ambiguity.
// RFG extracts LWJGL2 natives matching the gradle JVM's arch (arm64), which the x86_64
// client can't dlopen, so point LWJGL2 at x86_64 2.9.4 natives via org.lwjgl.librarypath.
// Populate that dir with:
//   curl -sSL -o /tmp/n.jar https://libraries.minecraft.net/org/lwjgl/lwjgl/lwjgl-platform/2.9.4-nightly-20150209/lwjgl-platform-2.9.4-nightly-20150209-natives-osx.jar
//   unzip -o -j /tmp/n.jar '*.dylib' -d .rosetta-natives/lwjgl2
if (project.hasProperty('rosetta')) {
    def rosettaLauncher = javaToolchains.launcherFor {
        languageVersion.set(JavaLanguageVersion.of(8))
        vendor.set(JvmVendorSpec.ADOPTIUM)
    }
    def rosettaNatives = file("${project.rootDir}/.rosetta-natives/lwjgl2")
    tasks.matching { it.name == 'runClient' }.configureEach {
        it.javaLauncher.set(rosettaLauncher)
        it.getExtraJvmArgs().add("-Dorg.lwjgl.librarypath=${rosettaNatives.absolutePath}".toString())
    }
    tasks.matching { it.name == 'runServer' }.configureEach {
        it.javaLauncher.set(rosettaLauncher)
    }
}