# OptiFine emissive textures: any sprite with a <name>_e companion draws that companion over
# itself at full brightness. This is how a PART of a baked model is lit in 1.12 -- there is no
# per-face emissive, and making the whole block report full brightness is not confined to the
# block, because a neighbour's renderer asks the block across each face for its packed light
# to shade that face's own vertices.
#
# _e is the near-universal suffix, so a resource pack or another mod declaring the same thing
# agrees with this rather than fighting it.
#
# Without OptiFine this file is never read and the _e textures are never referenced by any
# model, so nothing is stitched and nothing changes.
suffix.emissive=_e
